<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture game</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        color: #f5fbfc;
        background: radial-gradient(circle, #173949, #07141d 65%);
        font: 700 clamp(2rem, 6vw, 6rem)/1.1 system-ui, sans-serif;
        text-align: center;
      }
      p { margin: 0; max-width: 16ch; }
      small { display: block; margin-top: 1rem; color: #67dbe7; font-size: .25em; letter-spacing: .15em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <p><span id="game">Fixture game</span><small>The launcher handed control to the game</small></p>
    <script>
      const id = new URL(location.href).searchParams.get('game');
      if (id) document.querySelector('#game').textContent = id.replaceAll('-', ' ');
    </script>
  </body>
</html>
