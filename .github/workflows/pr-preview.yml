name: PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate design package
        run: node scripts/validate-design-package.mjs
      - name: Check application
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Build fixture preview
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
          PUBLIC_DATA_MODE: fixture
          PUBLIC_FIXTURE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build

  deploy:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: source
      - name: Check out Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-output
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build interactive fixture preview
        working-directory: source
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
          PUBLIC_DATA_MODE: fixture
          PUBLIC_FIXTURE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          npm ci
          npm run build
      - name: Assemble static preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          cd pages-output
          git rm -r --ignore-unmatch -- "pr-${PR_NUMBER}"
          mkdir -p "pr-${PR_NUMBER}"
          cp -R ../source/build/. "pr-${PR_NUMBER}/"
          printf '%s\n' "User-agent: *" "Disallow: /pr-${PR_NUMBER}/" > "pr-${PR_NUMBER}/robots.txt"
      - name: Publish exact PR directory
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd pages-output
          git add -A -- "pr-${PR_NUMBER}"
          if git diff --cached --quiet; then
            echo "Preview is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy preview for PR ${PR_NUMBER}"
          git push
      - name: Add preview link to pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
        run: >-
          gh pr comment "$PR_NUMBER"
          --repo "$GITHUB_REPOSITORY"
          --edit-last
          --create-if-none
          --body "Interactive launcher preview: [$PREVIEW_URL]($PREVIEW_URL) · data mode: fixture · no backend connection"
